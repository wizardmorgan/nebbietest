<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Myst Asset Browser</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="netBanner" class="net-banner" hidden></div>
  <header class="topbar">
    <div>
      <h1>Myst Asset Browser</h1>
      <p class="subtitle">Database interattivo per oggetti, mob, zone, stanze, reset, shop e special proc</p>
    </div>
    <div class="stats" id="stats"></div>
    <button id="reimportBtn" class="ghost">Reimporta da lib</button>
  </header>

  <nav class="tabs" id="tabs">
    <button data-tab="objects" class="active">Oggetti</button>
    <button data-tab="mobiles">Mob</button>
    <button data-tab="rooms">Stanze</button>
    <button data-tab="zones">Zone</button>
    <button data-tab="resets">Reset zone</button>
    <button data-tab="shops">Shop</button>
    <button data-tab="specials">Special proc</button>
  </nav>

  <section class="filters" id="filters"></section>

  <main class="workspace">
    <section class="table-panel">
      <div class="table-meta">
        <span id="resultCount">0 risultati</span>
        <div class="pager">
          <button id="prevPage" class="ghost">Prec</button>
          <span id="pageInfo">1</span>
          <button id="nextPage" class="ghost">Succ</button>
        </div>
      </div>
      <div class="table-scroll" id="tableScroll">
        <table id="resultsTable">
          <colgroup id="resultsColgroup"></colgroup>
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
    <section class="identify-panel" id="detail">
      <div class="identify-head">
        <h2 id="identifyTitle">Identify</h2>
        <span id="identifyHint" class="muted">Seleziona una riga nella tabella</span>
      </div>
      <div id="detailBody" class="detail-body muted">Nessun oggetto selezionato.</div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
