# Su Apple Silicon (arm64) mudcompiler è solo linux/amd64: forzare la piattaforma.
# UID/GID: runEnv scrive .env con LOCAL_UID/LOCAL_GID (stesso utente di consumer e mysql).
services:
    mysql:
        image: mysql:8
        user: "${LOCAL_UID}:${LOCAL_GID}"
        environment:
            - MYSQL_ROOT_PASSWORD=secret
            - MYSQL_DATABASE=nebbie
        ports:
            - 3306:33306
        volumes:
            - ./mysql_data:/var/lib/mysql
        command: ["mysqld", "--port=33306"]
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-P", "33306", "-uroot", "-psecret"]
            interval: 5s
            timeout: 5s
            retries: 30
            start_period: 30s
    adminer:
        image: adminer
        ports:
            - "0.0.0.0:8080:8080"
        depends_on:
            - mysql
        environment:
            - ADMINER_HOST=mysql
            - ADMINER_USER=root
            - ADMINER_PASSWORD=secret
            - ADMINER_DEFAULT_SERVER=mysql
            - ADMINER_DEFAULT_PORT=33306
    mudcompiler:
        image: nebbiearcane/mudcompiler:latest
        container_name: mudcompiler
        platform: ${DOCKER_PLATFORM:-linux/amd64}
        user: "${LOCAL_UID}:${LOCAL_GID}"
        entrypoint: ["/bin/bash", "/app/scripts/docker-entrypoint-mudcompiler.sh"]
        command: []
        stdin_open: true
        tty: true
        volumes:
            - ./:/app
            - /etc/group:/etc/group:ro
            - /etc/passwd:/etc/passwd:ro
        ports:
            - "${SERVER_PORT:-4000}:${SERVER_PORT:-4000}"
            - 4001:4001
            - 4002:4002
            - 4003:4003
            - 8090:8090
            - 10000:10000
        environment:
            - SERVER_PORT=${SERVER_PORT:-4000}
            - EDIT_API_PORT=8090
            - EDIT_API_SECRET=${EDIT_API_SECRET:-nebbie-edit-dev-secret}
            - MYSQL_HOST=mysql
            - MYSQL_DATABASE=nebbie
            - MYSQL_USER=root
            - MYSQL_PORT=33306
            - MYSQL_PASSWORD=secret
            - DATABASE_URL=mysql://root:secret@mysql:33306/nebbie
            - HOME=/app
        depends_on:
            mysql:
                condition: service_healthy
    edit-portal:
        build: ./edit-portal
        container_name: nebbie-edit-portal
        ports:
            - "3080:3080"
        environment:
            - EDIT_WEB_PORT=3080
            - EDIT_SESSION_SECRET=${EDIT_SESSION_SECRET:-nebbie-edit-session-dev}
            - EDIT_API_SECRET=${EDIT_API_SECRET:-nebbie-edit-dev-secret}
            - MYST_EDIT_API_URL=http://mudcompiler:8090
            - MYSQL_HOST=mysql
            - MYSQL_PORT=33306
            - MYSQL_USER=root
            - MYSQL_PASSWORD=secret
            - MYSQL_DATABASE=nebbie
            - EDIT_STAFF_LEVEL=57
            - EDIT_LIMITED_LEVEL=51
        depends_on:
            mysql:
                condition: service_healthy
        # myst avviato da scripts/mud-dev.sh (container --name mudcompiler), non da questo servizio compose.
