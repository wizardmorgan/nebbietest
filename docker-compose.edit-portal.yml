# Overlay: solo edit-portal. Stack mysql/mudcompiler da NebbieArcane/Server (mud-dev.sh).
# Uso: da EDIT_REPO con MUD_STACK_NETWORK impostato (vedi scripts/mud-dev.sh).
services:
    edit-portal:
        build: ./edit-portal
        container_name: nebbie-edit-portal
        ports:
            - "${EDIT_WEB_PORT:-3080}:3080"
        environment:
            - EDIT_WEB_PORT=${EDIT_WEB_PORT:-3080}
            - EDIT_SESSION_SECRET=${EDIT_SESSION_SECRET:-nebbie-edit-session-dev}
            - EDIT_API_SECRET=${EDIT_API_SECRET:-nebbie-edit-dev-secret}
            - MYST_EDIT_API_URL=http://mudcompiler:8090
            - MYSQL_HOST=mysql
            - MYSQL_PORT=33306
            - MYSQL_USER=root
            - MYSQL_PASSWORD=secret
            - MYSQL_DATABASE=nebbie
            - EDIT_STAFF_LEVEL=57
            - EDIT_LIMITED_LEVEL=51
            - EDIT_PORTAL_UI_BUILD=8
        networks:
            - mud_stack

networks:
    mud_stack:
        name: ${MUD_STACK_NETWORK}
        external: true
